name: Compile Fusion MachineGun EAs

on:
  workflow_dispatch:
  push:
    paths:
      - "Fusion_MachineGun_Recreation.mq5"
      - "Fusion_MachineGun_PRO.mq5"
      - ".github/workflows/compile-fusion.yml"

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and inspect MT5 installer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Write-Host "Installer size:"
          (Get-Item $installer).Length

          Write-Host "Installer signature:"
          Get-AuthenticodeSignature $installer |
            Format-List Status, StatusMessage, SignerCertificate

          Write-Host "Starting installer..."
          $p = Start-Process -FilePath $installer `
            -ArgumentList "/auto" `
            -Wait -PassThru

          Write-Host "Installer exit code: $($p.ExitCode)"

      - name: Diagnose MT5 files
        if: always()
        shell: powershell
        run: |
          Write-Host "=== MetaTrader installation directories ==="

          $roots = @(
            "C:\Program Files\MetaTrader 5",
            "C:\Program Files (x86)\MetaTrader 5",
            "$env:APPDATA\MetaQuotes",
            "$env:LOCALAPPDATA\Programs"
          )

          foreach ($root in $roots) {
            if (Test-Path $root) {
              Write-Host "Searching $root"

              Get-ChildItem $root -Recurse -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.Name -in @(
                    "metaeditor64.exe",
                    "terminal64.exe",
                    "Trade.mqh"
                  )
                } |
                ForEach-Object {
                  Write-Host $_.FullName
                }
            }
          }

          Write-Host "=== Repository source files ==="
          Get-ChildItem -Path . -Filter "*.mq5" -Recurse |
            Select-Object -ExpandProperty FullName

      - name: Compile both EAs
        shell: powershell
        run: |
          throw "Compilation paused intentionally until the installation diagnostic is reviewed."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fusion-MT5-Diagnostics
          path: |
            ${{ runner.temp }}\mt5setup.exe
          if-no-files-found: warn
