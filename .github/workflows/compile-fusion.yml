name: Compile Fusion MachineGun EAs

on:
  workflow_dispatch:
  push:
    paths:
      - "Fusion_MachineGun_Recreation.mq5"
      - "Fusion_MachineGun_PRO.mq5"
      - ".github/workflows/compile-fusion.yml"

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer

          Write-Host "Starting MT5 installer..."

          $p = Start-Process -FilePath $installer `
            -ArgumentList "/auto", "/path:C:\Program Files\MetaTrader 5" `
            -Wait -PassThru

          Write-Host "Installer exit code: $($p.ExitCode)"

          Write-Host "Checking for the standard trading library..."

          $library = "C:\Program Files\MetaTrader 5\MQL5\Include\Trade\Trade.mqh"

          if (Test-Path $library) {
            Write-Host "FOUND: $library"
          } else {
            Write-Host "Trade.mqh not found at the expected path."
          }

      - name: Diagnose MT5 files
        if: always()
        shell: powershell
        run: |
          Write-Host "=== MetaTrader installation root ==="

          $root = "C:\Program Files\MetaTrader 5"

          if (Test-Path $root) {
            Get-ChildItem $root -Force |
              Select-Object Name, FullName |
              Format-Table -AutoSize
          }

          Write-Host "=== MQL5 directories ==="

          $searchRoots = @(
            "C:\Program Files\MetaTrader 5",
            "$env:APPDATA\MetaQuotes\Terminal"
          )

          foreach ($path in $searchRoots) {
            if (Test-Path $path) {
              Get-ChildItem $path -Directory -Recurse `
                -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -eq "MQL5" } |
                ForEach-Object {
                  Write-Host "MQL5 folder: $($_.FullName)"
                }
            }
          }

          Write-Host "=== Trade.mqh search ==="

          foreach ($path in $searchRoots) {
            if (Test-Path $path) {
              Get-ChildItem $path -Filter "Trade.mqh" `
                -File -Recurse -ErrorAction SilentlyContinue |
                ForEach-Object {
                  Write-Host "FOUND: $($_.FullName)"
                }
            }
          }

          Write-Host "=== MetaEditor version ==="

          $editor = "C:\Program Files\MetaTrader 5\MetaEditor64.exe"

          if (Test-Path $editor) {
            (Get-Item $editor).VersionInfo |
              Select-Object FileVersion, ProductVersion |
              Format-List
          }

      - name: Compile both EAs
        shell: powershell
        run: |
          throw "Compilation paused intentionally until the installation diagnostic is reviewed."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fusion-MT5-Diagnostics
          path: |
            ${{ runner.temp }}\mt5setup.exe
          if-no-files-found: warn
