name: Compile Fusion MachineGun EAs

on:
  workflow_dispatch:
  push:
    paths:
      - "Fusion_MachineGun_Recreation.mq5"
      - "Fusion_MachineGun_PRO.mq5"
      - ".github/workflows/compile-fusion.yml"

jobs:
  compile:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Get EA source code
        uses: actions/checkout@v4

      - name: Install and verify MetaTrader 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $installer = "$env:RUNNER_TEMP\mt5setup.exe"
          $url = "https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe"

          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/auto" -Wait
          Start-Sleep -Seconds 10

          $editor = Get-ChildItem "C:\Program Files","C:\Program Files (x86)" `
            -Filter "metaeditor64.exe" -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $editor) {
            throw "MetaEditor was not found after installation."
          }

          $terminal = Get-ChildItem "C:\Program Files","C:\Program Files (x86)" `
            -Filter "terminal64.exe" -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($terminal) {
            Start-Process -FilePath $terminal.FullName
            Start-Sleep -Seconds 20
            Get-Process terminal64 -ErrorAction SilentlyContinue |
              Stop-Process -Force
          }

          $searchPaths = @(
            "C:\Program Files",
            "C:\Program Files (x86)",
            "$env:APPDATA\MetaQuotes\Terminal",
            "$env:LOCALAPPDATA\Programs"
          )

          $tradeLibrary = Get-ChildItem $searchPaths `
            -Filter "Trade.mqh" -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.FullName -match '\\MQL5\\Include\\Trade\\Trade\.mqh$'
            } |
            Select-Object -First 1

          if (-not $tradeLibrary) {
            throw "Trade.mqh was not found."
          }

          $mql5Root = $tradeLibrary.Directory.Parent.Parent.FullName

          "METAEDITOR_PATH=$($editor.FullName)" |
            Out-File $env:GITHUB_ENV -Append

          "MQL5_ROOT=$mql5Root" |
            Out-File $env:GITHUB_ENV -Append

          Write-Host "MetaEditor: $($editor.FullName)"
          Write-Host "Trade library: $($tradeLibrary.FullName)"
          Write-Host "MQL5 folder: $mql5Root"

      - name: Compile both EAs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $files = @(
            "Fusion_MachineGun_Recreation.mq5",
            "Fusion_MachineGun_PRO.mq5"
          )

          $failed = $false
          $experts = Join-Path $env:MQL5_ROOT "Experts"

          New-Item -ItemType Directory -Path $experts -Force |
            Out-Null

          foreach ($file in $files) {
            $source = Join-Path $env:GITHUB_WORKSPACE $file

            if (-not (Test-Path $source)) {
              Write-Host "Missing source: $source"
              $failed = $true
              continue
            }

            $target = Join-Path $experts $file
            Copy-Item $source $target -Force

            $output = [System.IO.Path]::ChangeExtension($target, ".ex5")
            $log = [System.IO.Path]::ChangeExtension($target, ".log")

            Remove-Item $output, $log -Force `
              -ErrorAction SilentlyContinue

            Write-Host "Compiling $file"

            $arguments = "/compile:`"$target`" /log"

            Start-Process -FilePath $env:METAEDITOR_PATH `
              -ArgumentList $arguments -Wait

            if (Test-Path $log) {
              Get-Content $log
            } else {
              Write-Host "Compiler log was not created for $file"
            }

            if (-not (Test-Path $output)) {
              Write-Host "No EX5 file produced for $file"
              $failed = $true
              continue
            }

            if ((Test-Path $log) -and
                ((Get-Content $log -Raw) -match '\b[1-9]\d*\s+errors?\b')) {
              Write-Host "Compiler errors found in $file"
              $failed = $true
              continue
            }

            Copy-Item $output $env:GITHUB_WORKSPACE -Force

            if (Test-Path $log) {
              Copy-Item $log $env:GITHUB_WORKSPACE -Force
            }

            Write-Host "Compiled successfully: $file"
          }

          if ($failed) {
            throw "One or both EAs failed. Check their compiler logs."
          }

      - name: Save compiled EAs and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fusion-MachineGun-Compile-Results
          path: |
            Fusion_MachineGun_Recreation.ex5
            Fusion_MachineGun_Recreation.log
            Fusion_MachineGun_PRO.ex5
            Fusion_MachineGun_PRO.log
          if-no-files-found: warn
